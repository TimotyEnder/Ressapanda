[package]
name = "ressapanda"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
bytemuck = "1.25.2"
cgmath = "0.18.0"
egui = "0.36.2"
egui-wgpu = "0.36.2"
egui-winit = "0.36.2"
env_logger = "0.11.11"
image = "0.25.10"
log = "0.4.34"
pollster = "1.0.1"
wgpu = "30.0.1"
winit = "0.30.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
egui-file-dialog = "0.15"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
